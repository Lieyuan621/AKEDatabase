<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title">AKEData · 终末地数据库</title>
    <link rel="icon" type="image/png" href="https://data.akedata.wiki/public/images/assets/beyond/dynamicassets/gameplay/ui/sprites/charremoteicon/icon_chr_0013_aglina.png">
    <link rel="stylesheet" id="base-style">
    <link rel="stylesheet" id="theme-style">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="dataLoadProgress" class="data-load-progress" role="progressbar" aria-label="数据加载进度" data-i18n-aria-label="common.dataLoadProgress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
        <div class="data-load-progress-track">
            <div id="dataLoadProgressBar" class="data-load-progress-bar"></div>
        </div>
        <div id="dataLoadProgressText" class="data-load-progress-text" aria-live="polite" data-i18n="common.loadingData">正在加载数据...</div>
        <div id="dataLoadProgressFile" class="data-load-progress-file"></div>
    </div>
    <div class="app">
        <div class="sidebar">
            <div class="brand" id="brandHome" title="返回起始页" data-i18n-title="nav.home">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-copy">
                    <strong class="brand-name">AKEData</strong>
                    <span class="brand-badge">Wiki</span>
                </span>
            </div>
            <div class="module-list" id="moduleListContainer">
                <div class="ake-ui-state" data-state="loading" data-density="compact" data-i18n="nav.loadingModules">加载模块清单...</div>
            </div>
            <div class="sidebar-footer">
                <div class="settings-button" id="settingsButton" title="全局设置" data-i18n-title="settings.title">
                    <img class="sidebar-tool-icon" data-database-src="/public/images/assets/beyond/dynamicassets/gameplay/ui/sprites/mainhud/btn_main_menu.png" alt="" aria-hidden="true" data-no-image-fallback>
                    <span class="sidebar-tool-label" data-i18n="settings.title">全局设置</span>
                </div>
                <div class="export-button" id="exportButton" title="导出长图" data-i18n-title="nav.export">
                    <span class="sidebar-tool-symbol" aria-hidden="true">📸</span>
                    <span class="sidebar-tool-label" data-i18n="nav.export">导出长图</span>
                </div>
            </div>
        </div>

        <div class="mobile-bottom-bar">
            <div class="mobile-menu-btn" id="mobileMenuBtn">☰</div>
            <div class="mobile-settings-btn" id="mobileSettingsBtn" aria-label="全局设置" data-i18n-aria-label="settings.title">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4A2 2 0 0 0 4 9.9l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <div class="mobile-export-btn" id="mobileExportBtn">📸</div>
        </div>

        <div class="main-content">
            <div class="content-area" id="contentArea"></div>
        </div>
    </div>

    <div class="app-modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsDialogTitle" hidden>
        <div class="app-dialog">
            <div class="app-dialog-header">
                <h3 class="app-dialog-title" id="settingsDialogTitle" data-i18n="settings.title">全局设置</h3>
                <button class="app-dialog-close" id="closeSettings" type="button" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="app-dialog-body">
                <div class="app-section">
                    <h4 class="app-section-title">
                        <svg class="app-section-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4A2 2 0 0 0 4 9.9l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span data-i18n="modules.settings.basicTitle">Basic settings</span>
                    </h4>
                    <div class="app-field">
                        <label class="app-field-label" for="modalLanguageSelect" data-i18n="settings.language">settings.language</label>
                        <select class="app-select" id="modalLanguageSelect"></select>
                    </div>
                    <div class="app-field">
                        <label class="app-field-label" for="modalThemeSelect" data-i18n="settings.theme">settings.theme</label>
                        <select class="app-select" id="modalThemeSelect">
                            <option value="light" data-i18n="settings.themes.light">settings.themes.light</option>
                            <option value="yellow" data-i18n="settings.themes.yellow">settings.themes.yellow</option>
                            <option value="dark" data-i18n="settings.themes.dark">settings.themes.dark</option>
                        </select>
                    </div>
                    <div class="app-field app-field--toggle">
                        <label class="app-field-label" for="modalShowHiddenCheck" data-i18n="settings.showHidden">settings.showHidden</label>
                        <input class="app-toggle" type="checkbox" id="modalShowHiddenCheck">
                    </div>
                    <div class="app-field app-field--toggle">
                        <label class="app-field-label" for="modalShowExportCheck" data-i18n="settings.showExport">settings.showExport</label>
                        <input class="app-toggle" type="checkbox" id="modalShowExportCheck">
                    </div>
                    <div class="app-field app-field--toggle">
                        <label class="app-field-label" for="modalShowVersionChanges" data-i18n="settings.showVersionChanges">settings.showVersionChanges</label>
                        <input class="app-toggle" type="checkbox" id="modalShowVersionChanges">
                    </div>
                    <div class="app-field app-field--toggle">
                        <label class="app-field-label" for="modalKeepUrlSync" data-i18n="settings.keepUrlSync">settings.keepUrlSync</label>
                        <input class="app-toggle" type="checkbox" id="modalKeepUrlSync">
                    </div>
                </div>

                <div class="app-section">
                    <h4 class="app-section-title">
                        <svg class="app-section-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>
                        <span data-i18n="settings.dataSource.title">Game data</span>
                    </h4>
                    <div class="app-field">
                        <label class="app-field-label" for="modalDataVersionSelect" data-i18n="settings.dataSource.version">Data version:</label>
                        <select class="app-select" id="modalDataVersionSelect"></select>
                    </div>
                    <div class="app-field">
                        <label class="app-field-label" for="modalDataBaseUrl" data-i18n="settings.dataSource.baseUrl">Request origin:</label>
                        <input class="app-input" type="url" id="modalDataBaseUrl" placeholder="https://data.akedata.wiki">
                        <button class="app-icon-button" id="resetDataSourceBtn" type="button" title="Restore production data source" data-i18n-title="settings.dataSource.reset" aria-label="Restore production data source">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                    </div>
                    <p class="app-status" id="dataSourceStatus"></p>
                </div>

                <!-- 等级设置区域 -->
                <div class="app-section">
                    <h4 class="app-section-title">
                        <svg class="app-section-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10h4v10M10 20V4h4v16M15 20v-7h4v7M3 20h18"/></svg>
                        <span data-i18n="settings.levels.title">settings.levels.title</span>
                    </h4>
                    <div class="app-field app-field--toggle">
                        <label class="app-field-label" for="modalLevelsEnabled" data-i18n="settings.levels.enabled">settings.levels.enabled</label>
                        <input class="app-toggle" type="checkbox" id="modalLevelsEnabled">
                    </div>
                    <div class="app-field app-field--hint">
                        <p data-i18n="settings.levels.hint">settings.levels.hint</p>
                    </div>
                    <div class="app-field">
                        <label class="app-field-label" for="modalCharacterLevels" data-i18n="settings.levels.character">settings.levels.character</label>
                        <input class="app-input" type="text" id="modalCharacterLevels" data-i18n-placeholder="settings.levels.levelPlaceholder">
                    </div>
                    <div class="app-field">
                        <label class="app-field-label" for="modalWeaponLevels" data-i18n="settings.levels.weapon">settings.levels.weapon</label>
                        <input class="app-input" type="text" id="modalWeaponLevels" data-i18n-placeholder="settings.levels.levelPlaceholder">
                    </div>
                    <div class="app-field">
                        <label class="app-field-label" for="modalEnemyLevels" data-i18n="settings.levels.enemy">settings.levels.enemy</label>
                        <input class="app-input" type="text" id="modalEnemyLevels" data-i18n-placeholder="settings.levels.levelPlaceholder">
                    </div>
                    <div class="app-field">
                        <label class="app-field-label" for="modalSkillLevels" data-i18n="settings.levels.skill">settings.levels.skill</label>
                        <input class="app-input" type="text" id="modalSkillLevels" data-i18n-placeholder="settings.levels.skillPlaceholder">
                    </div>
                </div>

                <!-- 恢复默认按钮 -->
                <div class="app-actions app-actions--section-break">
                    <button class="app-button app-button--secondary" id="resetSettingsBtn" type="button" data-i18n="settings.reset">settings.reset</button>
                </div>

                <!-- 访问令牌区域 -->
                <div class="app-section">
                    <h4 class="app-section-title">
                        <svg class="app-section-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l3 3M14 9l2 2"/></svg>
                        <span data-i18n="settings.tokens.title">settings.tokens.title</span>
                    </h4>
                    <div class="app-field app-field--hint">
                        <p data-i18n="settings.tokens.hint">settings.tokens.hint</p>
                    </div>
                    <div class="app-field app-field--action">
                        <label class="app-field-label" for="modalTokenInput" data-i18n="settings.tokens.label">settings.tokens.label</label>
                        <input class="app-input" type="text" id="modalTokenInput" data-i18n-placeholder="settings.tokens.placeholder">
                        <button class="app-button app-button--primary" id="tokenSubmitBtn" type="button" data-i18n="settings.tokens.submit">settings.tokens.submit</button>
                    </div>
                    <div class="app-actions">
                        <button class="app-button app-button--secondary" id="tokenClearAllBtn" type="button" data-i18n="settings.tokens.clear">settings.tokens.clear</button>
                    </div>
                    <div class="app-status" id="tokenStatus"></div>
                </div>

                <div class="app-section app-section--standalone-action">
                    <button class="app-button app-button--primary" id="forceRefreshCacheBtn" type="button" data-i18n="settings.cache.forceRefresh">强制刷新网页缓存</button>
                    <p class="app-help" data-i18n="settings.cache.description">由于服务器数据存在延迟，若您显示的页面中没有最新的数据，可以点击此按钮获取最新数据</p>
                </div>

                <div class="app-meta" id="appVersionInfo">
                    <p data-i18n="version.loading">version.loading</p>
                </div>
            </div>
        </div>
    </div>

    <div class="app-modal" id="tipModal" role="dialog" aria-modal="true" aria-labelledby="tipModalTitle" hidden>
        <div class="app-dialog app-dialog--announcement">
            <div class="app-dialog-header">
                <h3 class="app-dialog-title" id="tipModalTitle" data-i18n="home.announcement">网站公告</h3>
                <button class="app-dialog-close" id="closeTipModal" type="button" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="app-dialog-body tip-modal-body" id="tipModalBody"></div>
        </div>
    </div>

    <div id="hyperlink-tooltip-1" class="hyperlink-tooltip"></div>
    <div id="hyperlink-tooltip-2" class="hyperlink-tooltip"></div>

    <div id="mobileMenuOverlay" class="mobile-menu-overlay">
        <div class="mobile-menu-container">
            <div class="mobile-menu-header" data-i18n="nav.selectModule">选择模块</div>
            <div class="mobile-menu-list" id="mobileMenuList"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        (async function bootstrap() {
            let version = null;
            try {
                const response = await fetch(`/version.json?t=${Date.now()}`, { cache: 'no-store' });
                if (response.ok) version = await response.json();
            } catch (error) {
                console.warn('无法读取 version.json，将使用无版本启动资源。', error);
            }
            window.__akeBootstrapVersion = version;
            const isPreRelease = String(version?.appversion || '').toLowerCase().includes('pre');
            document.documentElement.classList.toggle('ake-pre-release', isPreRelease);
            const brandBadge = document.querySelector('#brandHome .brand-badge');
            if (brandBadge && isPreRelease) brandBadge.textContent = 'beta';
            if (isPreRelease) {
                const svgNamespace = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(svgNamespace, 'svg');
                svg.setAttribute('xmlns', svgNamespace);
                svg.setAttribute('width', '340');
                svg.setAttribute('height', '180');
                svg.setAttribute('viewBox', '0 0 340 180');

                const group = document.createElementNS(svgNamespace, 'g');
                group.setAttribute('transform', 'rotate(-24 170 90)');
                const addWatermarkLine = (content, y, fontSize, fontWeight) => {
                    const text = document.createElementNS(svgNamespace, 'text');
                    text.textContent = content;
                    text.setAttribute('x', '170');
                    text.setAttribute('y', String(y));
                    text.setAttribute('fill', '#969696');
                    text.setAttribute('fill-opacity', '0.1');
                    text.setAttribute('font-family', 'Segoe UI, Microsoft YaHei, sans-serif');
                    text.setAttribute('font-size', String(fontSize));
                    text.setAttribute('font-weight', String(fontWeight));
                    text.setAttribute('text-anchor', 'middle');
                    if (content.length > 30) {
                        text.setAttribute('textLength', '280');
                        text.setAttribute('lengthAdjust', 'spacingAndGlyphs');
                    }
                    group.appendChild(text);
                };
                addWatermarkLine(location.hostname || 'localhost', 82, 16, 600);
                addWatermarkLine('测试版本，仅供参考', 108, 14, 500);
                svg.appendChild(group);

                const watermark = document.createElement('div');
                watermark.className = 'pre-release-watermark';
                watermark.setAttribute('aria-hidden', 'true');
                const svgSource = new XMLSerializer().serializeToString(svg);
                watermark.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svgSource)}")`;
                document.body.appendChild(watermark);
            }
            const requestedRefresh = new URLSearchParams(location.search).get('t');
            const refreshTimestamp = version?.debugmode === true ? String(Date.now()) : requestedRefresh;
            window.__akeForceRefreshTimestamp = refreshTimestamp || '';
            const jsVersionStorageKey = 'akedata-js-versions';
            const resourceKey = src => new URL(src, location.href).pathname.replace(/^\/+/, '');
            const currentResourceVersion = src => {
                const key = resourceKey(src);
                return version?.jsversion?.[key] || version?.appversion || '';
            };
            let storedJsVersions = {};
            try {
                storedJsVersions = JSON.parse(localStorage.getItem(jsVersionStorageKey) || '{}');
                if (!storedJsVersions || typeof storedJsVersions !== 'object' || Array.isArray(storedJsVersions)) storedJsVersions = {};
            } catch {
                storedJsVersions = {};
            }
            const rememberJsVersion = (key, value) => {
                if (!value || storedJsVersions[key] === value) return;
                storedJsVersions[key] = value;
                try { localStorage.setItem(jsVersionStorageKey, JSON.stringify(storedJsVersions)); } catch {}
            };
            const resourceUrl = src => {
                const url = new URL(src, location.href);
                const resourceVersion = currentResourceVersion(src);
                if (resourceVersion) url.searchParams.set('v', resourceVersion);
                if (refreshTimestamp) url.searchParams.set('t', refreshTimestamp);
                return url.href;
            };
            const resourceCache = refreshTimestamp ? 'no-store' : 'force-cache';
            const baseLink = document.getElementById('base-style');
            if (baseLink) baseLink.href = resourceUrl('/theme/light.css');
            const themeLink = document.getElementById('theme-style');
            if (themeLink) {
                const themeUrl = resourceUrl('/theme/light.css');
                try {
                    const themeResponse = await fetch(themeUrl, { cache: resourceCache });
                    if (!themeResponse.ok) throw new Error(`HTTP ${themeResponse.status}`);
                    await themeResponse.text();
                } catch (error) {
                    console.warn('无法预加载默认主题样式。', error);
                }
                themeLink.removeAttribute('href');
            }
            const loadScript = async src => {
                const key = resourceKey(src);
                const resourceVersion = currentResourceVersion(src);
                const cacheMode = refreshTimestamp
                    ? 'no-store'
                    : resourceVersion && storedJsVersions[key] !== resourceVersion
                        ? 'reload'
                        : 'force-cache';
                const response = await fetch(resourceUrl(src), { cache: cacheMode });
                if (!response.ok) throw new Error(`无法加载 ${src} (HTTP ${response.status})`);
                const source = await response.text();
                rememberJsVersion(key, resourceVersion);
                const script = document.createElement('script');
                script.textContent = `${source}\n//# sourceURL=${new URL(src, location.href).href}`;
                document.body.appendChild(script);
            };
            try {
                await loadScript('/plugin/js/ake-image-fallback.js');
                await loadScript('/plugin/js/index-parse-fallback.js');
                await loadScript('/plugin/js/i18n.js');
                await loadScript('/plugin/js/app-select.js');
                await loadScript('/plugin/js/ake-ui.js');
                await loadScript('/plugin/js/toast.js');
                await loadScript('/plugin/js/ake-data-source.js');
                await loadScript('/plugin/js/ake-cache.js');
                await loadScript('/plugin/js/sidebar-resize.js');
                await loadScript('/plugin/js/module-view-state.js');
                await loadScript('/plugin/js/v3-table-data.js');
                await loadScript('/plugin/js/index-app.js');
            } catch (error) {
                const content = document.getElementById('contentArea');
                if (content) content.innerHTML = `<div class="error-message">${window.akeI18n?.t('errors.startup', { message: error.message }, `Startup failed: ${error.message}`) || error.message}</div>`;
            }
        })();
    </script>
</body>
</html>
