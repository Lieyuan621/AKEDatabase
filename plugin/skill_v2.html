<!-- plugin/skill_v2.html -->
<link rel="stylesheet" href="/theme/skill_v2.css">

<div class="skillv2-module">
    <aside class="skillv2-list-panel">
        <div class="skillv2-search-wrap">
            <input type="text" id="skillv2SearchInput" class="search-input" placeholder="搜索 SkillData (id/name)">
        </div>
        <div class="skillv2-list-meta" id="skillv2ListMeta">加载中...</div>
        <div class="skillv2-list" id="skillv2List"></div>
    </aside>

    <section class="skillv2-main" id="skillv2Main">
        <div class="loader">正在加载 SkillData...</div>
    </section>
</div>

<div class="skillv2-mobile-btn" id="skillv2MobileBtn">列表</div>
<div class="skillv2-mobile-overlay" id="skillv2MobileOverlay">
    <div class="skillv2-mobile-container">
        <div class="skillv2-mobile-header">选择技能</div>
        <div class="skillv2-mobile-content" id="skillv2MobileContent"></div>
    </div>
</div>

<div id="skillv2TimelineTooltip" class="skillv2-timeline-tooltip" aria-hidden="true"></div>

<script src="/plugin/js/skill-v2.js"></script>
