<!-- plugin/v2_enemy.html -->
<link rel="stylesheet" href="/theme/v2_enemy.css">

<div class="v2e-module">
    <div class="v2e-left">
        <div class="v2e-search">
            <input type="text" id="v2enemySearchInput" placeholder="modules.enemy.search" data-i18n-placeholder="modules.enemy.search">
        </div>
        <div class="v2e-list" id="v2enemyList"></div>
    </div>
    <div class="v2e-detail" id="v2enemyDetail">
        <div class="v2e-loader" data-i18n="modules.enemy.loading">modules.enemy.loading</div>
    </div>
    <div class="v2e-mobile-btn" id="v2enemyMobileListBtn" data-i18n="common.mobileList">common.mobileList</div>
    <div id="v2enemyMobileListOverlay" class="v2e-mobile-overlay">
        <div class="v2e-mobile-container">
            <div class="v2e-mobile-header" data-i18n="modules.enemy.select">modules.enemy.select</div>
            <div class="v2e-mobile-content" id="v2enemyMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/ake-stats.js"></script>
<script src="/plugin/js/v2-enemy.js"></script>
