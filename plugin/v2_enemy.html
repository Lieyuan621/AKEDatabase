<!-- plugin/v2_enemy.html -->
<link rel="stylesheet" href="/theme/v2_enemy.css">

<div class="v2e-module">
    <div class="v2e-left">
        <div class="v2e-search">
            <input type="text" id="v2enemySearchInput" placeholder="搜索敌人 (名称/ID)" data-i18n-placeholder="moduleInternal.v2Enemy.search">
        </div>
        <div class="v2e-list" id="v2enemyList"></div>
    </div>
    <div class="v2e-detail" id="v2enemyDetail">
        <div class="v2e-loader" data-i18n="moduleInternal.v2Enemy.loading">加载敌人数据...</div>
    </div>
    <div class="v2e-mobile-btn" id="v2enemyMobileListBtn">📋 <span data-i18n="common.list">列表</span></div>
    <div id="v2enemyMobileListOverlay" class="v2e-mobile-overlay">
        <div class="v2e-mobile-container">
            <div class="v2e-mobile-header" data-i18n="moduleInternal.v2Enemy.select">选择敌人</div>
            <div class="v2e-mobile-content" id="v2enemyMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/ake-stats.js"></script>
<script src="/plugin/js/v2-enemy.js"></script>
