<script src="/plugin/js/v3-table-data.js"></script>
<script src="/plugin/js/module-overview.js"></script>
<div class="ake-ui-directory" id="akeShopModule" data-ake-module="shop">
    <aside class="ake-ui-directory__sidebar">
        <label class="ake-ui-directory__search">
            <span class="ake-ui-directory__search-icon" aria-hidden="true"></span>
            <input id="akeShopSearch" type="search" data-i18n-placeholder="modules.shop.search" placeholder="搜索商店或商品">
        </label>
        <nav class="ake-ui-directory__list" id="akeShopGroupList" data-i18n-aria-label="modules.shop.groupList" aria-label="商店组列表"></nav>
    </aside>
    <main class="ake-ui-directory__content" id="akeShopContent">
        <div class="ake-ui-state" data-state="loading" data-layout="page"><b data-i18n="modules.shop.loading">正在读取商店数据</b></div>
    </main>
    <button class="ake-ui-directory__mobile-button" id="akeShopMobileButton" type="button" data-i18n="modules.shop.groups">商店组</button>
    <div class="ake-ui-directory__mobile-overlay" id="akeShopMobileOverlay" aria-hidden="true">
        <section class="ake-ui-directory__mobile-panel" role="dialog" aria-modal="true" data-i18n-aria-label="modules.shop.selectGroup" aria-label="选择商店组">
            <header class="ake-ui-directory__mobile-header">
                <strong data-i18n="modules.shop.selectGroup">选择商店组</strong>
                <button type="button" data-i18n-aria-label="modules.shop.close" aria-label="关闭">×</button>
            </header>
            <div class="ake-ui-directory__mobile-list" id="akeShopMobileGroups"></div>
        </section>
    </div>
</div>
<script src="/plugin/js/v3-shop.js"></script>
