<script src="/plugin/js/v3-table-data.js"></script>
<link rel="stylesheet" href="/theme/module-overview.css">
<link rel="stylesheet" href="/theme/v3_shop.css">
<script src="/plugin/js/module-overview.js"></script>
<div class="akeshop-module" id="akeShopModule">
    <aside class="akeshop-sidebar">
        <label class="akeshop-search">
            <span aria-hidden="true">⌕</span>
            <input id="akeShopSearch" type="search" data-i18n-placeholder="modules.shop.search" placeholder="搜索商店或商品">
        </label>
        <nav class="akeshop-group-list" id="akeShopGroupList" data-i18n-aria-label="modules.shop.groupList" aria-label="商店组列表"></nav>
    </aside>
    <main class="akeshop-content" id="akeShopContent">
        <div class="akeshop-loading"><span></span><b data-i18n="modules.shop.loading">正在读取商店数据</b></div>
    </main>
    <button class="akeshop-mobile-button" id="akeShopMobileButton" type="button" data-i18n="modules.shop.groups">商店组</button>
    <div class="akeshop-mobile-overlay" id="akeShopMobileOverlay" aria-hidden="true">
        <div class="akeshop-mobile-panel" role="dialog" aria-modal="true" data-i18n-aria-label="modules.shop.selectGroup" aria-label="选择商店组">
            <div class="akeshop-mobile-title">
                <strong data-i18n="modules.shop.selectGroup">选择商店组</strong>
                <button type="button" data-i18n-aria-label="modules.shop.close" aria-label="关闭">×</button>
            </div>
            <div class="akeshop-mobile-groups" id="akeShopMobileGroups"></div>
        </div>
    </div>
</div>
<script src="/plugin/js/v3-shop.js"></script>
