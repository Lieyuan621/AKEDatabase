<!-- plugin/v2_equip.html -->
<link rel="stylesheet" href="/theme/v2_equip.css">

<div class="v2eq-module">
    <div class="v2eq-left">
        <div class="v2eq-search">
            <input type="text" id="v2equipSearchInput" placeholder="搜索装备套组 (名称/ID)" data-i18n-placeholder="moduleInternal.v2Equip.search">
        </div>
        <div class="v2eq-list" id="v2equipList"></div>
    </div>
    <div class="v2eq-detail" id="v2equipDetail">
        <div class="v2eq-loader" data-i18n="moduleInternal.v2Equip.loading">加载装备数据...</div>
    </div>
    <div class="v2eq-mobile-btn" id="v2equipMobileListBtn">📋 <span data-i18n="common.list">列表</span></div>
    <div id="v2equipMobileListOverlay" class="v2eq-mobile-overlay">
        <div class="v2eq-mobile-container">
            <div class="v2eq-mobile-header" data-i18n="moduleInternal.v2Equip.select">选择装备套组</div>
            <div class="v2eq-mobile-content" id="v2equipMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/v2-equip.js"></script>
