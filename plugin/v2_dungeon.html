<!-- plugin/v2_dungeon.html -->
<link rel="stylesheet" href="/theme/v2_dungeon.css">

<div class="v2d-module">
    <div class="v2d-left">
        <div class="v2d-search">
            <input type="text" id="v2dungeonSearchInput" placeholder="modules.dungeon.search" data-i18n-placeholder="modules.dungeon.search">
        </div>
        <div class="v2d-list" id="v2dungeonList"></div>
    </div>
    <div class="v2d-detail" id="v2dungeonDetail">
        <div class="v2d-loader" data-i18n="modules.dungeon.loading">modules.dungeon.loading</div>
    </div>
    <div class="v2d-mobile-btn" id="v2dungeonMobileListBtn" data-i18n="common.mobileList">common.mobileList</div>
    <div id="v2dungeonMobileListOverlay" class="v2d-mobile-overlay">
        <div class="v2d-mobile-container">
            <div class="v2d-mobile-header" data-i18n="modules.dungeon.select">modules.dungeon.select</div>
            <div class="v2d-mobile-content" id="v2dungeonMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/ake-stats.js"></script>
<script src="/plugin/js/ake-combat-data.js"></script>
<script src="/plugin/js/v2-dungeon.js"></script>
