<!-- plugin/activity.html -->
<link rel="stylesheet" href="/theme/activity.css">

<div class="activity-module">
    <div class="left-column">
        <div class="list-search">
            <input type="text" id="activitySearchInput" placeholder="搜索活动 (名称/ID)" class="search-input">
        </div>
        <div class="filter-bar" id="activityFilterBar">
            <div class="filter-section">
                <span class="filter-label">类型:</span>
                <div class="filter-buttons" id="activityTypeFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label">状态:</span>
                <div class="filter-buttons" id="activityStatusFilter"></div>
            </div>
        </div>
        <div class="activity-list" id="activityList"></div>
    </div>
    <div class="activity-detail" id="activityDetail">
        <div class="loader">加载活动数据...</div>
    </div>
</div>

<div class="mobile-list-btn" id="activityMobileListBtn">📋 列表</div>
<div id="activityMobileListOverlay" class="mobile-list-overlay">
    <div class="mobile-list-container">
        <div class="mobile-list-header">选择活动</div>
        <div class="mobile-list-content" id="activityMobileListContent"></div>
    </div>
</div>

<script src="/plugin/js/activity.js"></script>
