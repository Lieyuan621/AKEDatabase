<!-- plugin/v2_weapon.html -->
<link rel="stylesheet" href="/theme/v2_weapon.css">

<div class="weapon-module">
    <div class="mobile-list-btn" id="v2wpnMobileListBtn" data-i18n="common.mobileList">common.mobileList</div>
    <div id="v2wpnMobileListOverlay" class="mobile-list-overlay">
        <div class="mobile-list-container">
            <div class="mobile-list-header" data-i18n="modules.weapon.select">modules.weapon.select</div>
            <div class="mobile-list-content" id="v2wpnMobileListContent"></div>
        </div>
    </div>
    <div class="weapon-list" id="v2wpnList">
        <div class="list-search-fixed">
            <input type="text" id="v2wpnSearchInput" placeholder="modules.weapon.search" data-i18n-placeholder="modules.weapon.search" class="search-input">
        </div>
        <div class="filter-bar" id="v2wpnFilterBar">
            <div class="filter-section">
                <span class="filter-label" data-i18n="common.rarity">common.rarity</span>
                <div class="filter-buttons" id="v2wpnRarityFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label" data-i18n="common.type">common.type</span>
                <div class="filter-buttons" id="v2wpnTypeFilter"></div>
            </div>
        </div>
        <div class="list-items" id="v2wpnListItems"></div>
    </div>
    <div class="weapon-detail" id="v2wpnDetail">
        <div class="loader" data-i18n="modules.weapon.loading">modules.weapon.loading</div>
    </div>
</div>

<script src="/plugin/js/v2-weapon.js"></script>
