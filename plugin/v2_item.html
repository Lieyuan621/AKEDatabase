<!-- plugin/v2_item.html -->
<link rel="stylesheet" href="/theme/v2_item.css">

<div class="v2i-module">
    <div class="v2i-left">
        <div class="v2i-search">
            <input type="text" id="v2itemSearchInput" placeholder="搜索物品 (名称/ID)">
        </div>
        <div class="v2i-filter-bar" id="v2itemFilterBar">
            <button class="v2i-filter-toggle" id="v2itemFilterToggle" type="button" aria-expanded="false" aria-controls="v2itemFilterContent">
                <span id="v2itemFilterSummary">筛选</span>
                <span class="v2i-filter-chevron" aria-hidden="true"></span>
            </button>
            <div class="v2i-filter-content" id="v2itemFilterContent" hidden>
                <div class="v2i-filter-section">
                    <span class="v2i-filter-label">稀有度:</span>
                    <div class="v2i-filter-buttons" id="v2itemRarityFilter"></div>
                </div>
                <div class="v2i-filter-section">
                    <span class="v2i-filter-label">分类:</span>
                    <div class="v2i-filter-buttons" id="v2itemCategoryFilter"></div>
                </div>
            </div>
        </div>
        <div class="v2i-list" id="v2itemList"></div>
    </div>
    <div class="v2i-detail" id="v2itemDetail">
        <div class="v2i-loader">加载物品数据...</div>
    </div>
    <div class="v2i-mobile-btn" id="v2itemMobileListBtn">📋 列表</div>
    <div id="v2itemMobileListOverlay" class="v2i-mobile-overlay">
        <div class="v2i-mobile-container">
            <div class="v2i-mobile-header">选择物品</div>
            <div class="v2i-mobile-content" id="v2itemMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/v2-item.js"></script>
