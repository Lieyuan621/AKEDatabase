<!-- plugin/v2_character.html -->
<link rel="stylesheet" href="/theme/v2_character.css">

<div class="character-module">
    <div class="left-column">
        <div class="list-search">
            <input type="text" id="v2charSearchInput" placeholder="搜索角色 (名称/ID)" class="search-input" data-i18n-placeholder="moduleInternal.v2Character.search">
        </div>
        <!-- 筛选栏 -->
        <div class="filter-bar" id="v2charFilterBar">
            <div class="filter-section">
                <span class="filter-label" data-i18n="common.rarity">星级:</span>
                <div class="filter-buttons" id="v2charRarityFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label" data-i18n="common.attribute">属性:</span>
                <div class="filter-buttons" id="v2charTypeFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label" data-i18n="common.profession">职业:</span>
                <div class="filter-buttons" id="v2charProfessionFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label" data-i18n="common.weapon">武器:</span>
                <div class="filter-buttons" id="v2charWeaponFilter"></div>
            </div>
        </div>
        <div class="character-list" id="v2characterList"></div>
    </div>
    <div class="character-detail" id="v2characterDetail">
        <div class="loader" data-i18n="moduleInternal.v2Character.loading">加载干员数据...</div>
    </div>
    <div class="mobile-list-btn" id="v2charMobileListBtn">📋 <span data-i18n="common.list">列表</span></div>
    <div id="v2charMobileListOverlay" class="mobile-list-overlay">
        <div class="mobile-list-container">
            <div class="mobile-list-header" data-i18n="moduleInternal.v2Character.select">选择角色</div>
            <div class="mobile-list-content" id="v2charMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/v2-character.js"></script>
