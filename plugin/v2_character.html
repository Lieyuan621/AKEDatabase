<!-- plugin/v2_character.html -->
<link rel="stylesheet" href="/theme/v2_character.css">

<div class="character-module">
    <div class="left-column">
        <div class="list-search">
            <input type="text" id="v2charSearchInput" placeholder="modules.character.search" data-i18n-placeholder="modules.character.search" class="search-input">
        </div>
        <!-- 筛选栏 -->
        <div class="filter-bar" id="v2charFilterBar">
            <div class="filter-section">
                <span class="filter-label" data-i18n="common.rarity">common.rarity</span>
                <div class="filter-buttons" id="v2charRarityFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label" data-i18n="modules.character.element">modules.character.element</span>
                <div class="filter-buttons" id="v2charTypeFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label" data-i18n="modules.character.profession">modules.character.profession</span>
                <div class="filter-buttons" id="v2charProfessionFilter"></div>
            </div>
            <div class="filter-section">
                <span class="filter-label" data-i18n="modules.character.weapon">modules.character.weapon</span>
                <div class="filter-buttons" id="v2charWeaponFilter"></div>
            </div>
        </div>
        <div class="character-list" id="v2characterList"></div>
    </div>
    <div class="character-detail" id="v2characterDetail">
        <div class="loader" data-i18n="modules.character.loading">modules.character.loading</div>
    </div>
    <div class="mobile-list-btn" id="v2charMobileListBtn" data-i18n="common.mobileList">common.mobileList</div>
    <div id="v2charMobileListOverlay" class="mobile-list-overlay">
        <div class="mobile-list-container">
            <div class="mobile-list-header" data-i18n="modules.character.select">modules.character.select</div>
            <div class="mobile-list-content" id="v2charMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/v2-character.js"></script>
