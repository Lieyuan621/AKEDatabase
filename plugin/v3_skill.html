<script src="/plugin/js/v3-table-data.js"></script>
<script src="/plugin/js/v3-skill-data.js"></script>
<div class="ake-ui-directory" id="combatv3Module" data-ake-module="skill">
    <aside class="ake-ui-directory__sidebar" aria-label="战斗技能列表" data-i18n-aria-label="modules.combat.aria.sidebar">
        <header class="ake-ui-directory__sidebar-header">
            <h1 data-i18n="modules.combat.title">战斗</h1>
            <div class="ake-ui-directory__meta" id="combatv3ListMeta" aria-live="polite" data-i18n="modules.combat.loading.directory">正在读取数据</div>
        </header>

        <label class="ake-ui-directory__search" for="combatv3SearchInput">
            <span data-i18n="modules.combat.search.label">搜索</span>
            <input
                id="combatv3SearchInput"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="角色、怪物或技能"
                aria-label="搜索角色、怪物或技能"
                data-i18n-placeholder="modules.combat.search.placeholder"
                data-i18n-aria-label="modules.combat.aria.search"
            >
        </label>

        <nav
            class="ake-ui-tree"
            id="combatv3GroupList"
            aria-label="角色、怪物与技能"
            data-i18n-aria-label="modules.combat.aria.directory"
        ></nav>
    </aside>

    <main class="ake-ui-directory__content" id="combatv3Detail" tabindex="-1" aria-live="polite">
        <div class="ake-ui-state" data-state="loading">
            <span class="ake-ui-spinner" aria-hidden="true"></span>
            <div>
                <h2 data-i18n="modules.combat.title">战斗</h2>
                <p data-i18n="modules.combat.loading.skillData">正在读取技能数据</p>
            </div>
        </div>
    </main>

    <button
        class="ake-ui-directory__mobile-button"
        id="combatv3MobileListButton"
        type="button"
        aria-controls="combatv3MobileOverlay"
        aria-expanded="false"
        data-i18n="modules.combat.buttons.skillList"
    >技能列表</button>

    <div
        class="ake-ui-directory__mobile-overlay"
        id="combatv3MobileOverlay"
        aria-hidden="true"
    >
        <section
            class="ake-ui-directory__mobile-panel"
            id="combatv3MobilePanel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="combatv3MobileTitle"
        >
            <header class="ake-ui-directory__mobile-header">
                <strong id="combatv3MobileTitle" data-i18n="modules.combat.buttons.selectSkill">选择技能</strong>
                <button
                    class="ake-ui-icon-button"
                    id="combatv3MobileClose"
                    type="button"
                    aria-label="关闭技能列表"
                    title="关闭"
                    data-i18n-aria-label="modules.combat.aria.close"
                    data-i18n-title="modules.combat.buttons.close"
                >×</button>
            </header>
            <label class="ake-ui-directory__search ake-ui-directory__search--mobile" for="combatv3MobileSearchInput">
                <span data-i18n="modules.combat.search.label">搜索</span>
                <input
                    id="combatv3MobileSearchInput"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="角色、怪物或技能"
                    aria-label="搜索角色、怪物或技能"
                    data-i18n-placeholder="modules.combat.search.placeholder"
                    data-i18n-aria-label="modules.combat.aria.search"
                >
            </label>
            <nav
                class="ake-ui-tree ake-ui-directory__mobile-list"
                id="combatv3MobileList"
                aria-label="移动端角色、怪物与技能"
                data-i18n-aria-label="modules.combat.aria.mobileDirectory"
            ></nav>
        </section>
    </div>

    <div
        class="combatv3-timeline-tooltip"
        id="combatv3TimelineTooltip"
        role="tooltip"
        aria-hidden="true"
    ></div>
</div>

<script src="/plugin/js/v3-skill.js"></script>
