<script src="/plugin/js/v3-table-data.js"></script>
<script src="/plugin/js/v3-skill-data.js"></script>
<link rel="stylesheet" href="/theme/v3_skill.css">

<div class="combatv3-module" id="combatv3Module">
    <aside class="combatv3-sidebar" aria-label="战斗技能列表" data-i18n-aria-label="modules.combat.aria.sidebar">
        <header class="combatv3-sidebar-header">
            <h1 data-i18n="modules.combat.title">战斗</h1>
            <div class="combatv3-list-meta" id="combatv3ListMeta" aria-live="polite" data-i18n="modules.combat.loading.directory">正在读取数据</div>
        </header>

        <label class="combatv3-search" for="combatv3SearchInput">
            <span data-i18n="modules.combat.search.label">搜索</span>
            <input
                id="combatv3SearchInput"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="角色、怪物或技能"
                aria-label="搜索角色、怪物或技能"
                data-i18n-placeholder="modules.combat.search.placeholder"
                data-i18n-aria-label="modules.combat.aria.search"
            >
        </label>

        <nav
            class="combatv3-group-list"
            id="combatv3GroupList"
            aria-label="角色、怪物与技能"
            data-i18n-aria-label="modules.combat.aria.directory"
        ></nav>
    </aside>

    <main class="combatv3-detail" id="combatv3Detail" tabindex="-1" aria-live="polite">
        <div class="combatv3-state combatv3-state--loading">
            <span class="combatv3-spinner" aria-hidden="true"></span>
            <div>
                <h2 data-i18n="modules.combat.title">战斗</h2>
                <p data-i18n="modules.combat.loading.skillData">正在读取技能数据</p>
            </div>
        </div>
    </main>

    <button
        class="combatv3-mobile-list-button"
        id="combatv3MobileListButton"
        type="button"
        aria-controls="combatv3MobileOverlay"
        aria-expanded="false"
        data-i18n="modules.combat.buttons.skillList"
    >技能列表</button>

    <div
        class="combatv3-mobile-overlay"
        id="combatv3MobileOverlay"
        aria-hidden="true"
    >
        <section
            class="combatv3-mobile-panel"
            id="combatv3MobilePanel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="combatv3MobileTitle"
        >
            <header class="combatv3-mobile-header">
                <strong id="combatv3MobileTitle" data-i18n="modules.combat.buttons.selectSkill">选择技能</strong>
                <button
                    class="combatv3-icon-button"
                    id="combatv3MobileClose"
                    type="button"
                    aria-label="关闭技能列表"
                    title="关闭"
                    data-i18n-aria-label="modules.combat.aria.close"
                    data-i18n-title="modules.combat.buttons.close"
                >×</button>
            </header>
            <label class="combatv3-search combatv3-search--mobile" for="combatv3MobileSearchInput">
                <span data-i18n="modules.combat.search.label">搜索</span>
                <input
                    id="combatv3MobileSearchInput"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="角色、怪物或技能"
                    aria-label="搜索角色、怪物或技能"
                    data-i18n-placeholder="modules.combat.search.placeholder"
                    data-i18n-aria-label="modules.combat.aria.search"
                >
            </label>
            <nav
                class="combatv3-group-list combatv3-mobile-list"
                id="combatv3MobileList"
                aria-label="移动端角色、怪物与技能"
                data-i18n-aria-label="modules.combat.aria.mobileDirectory"
            ></nav>
        </section>
    </div>

    <div
        class="combatv3-timeline-tooltip"
        id="combatv3TimelineTooltip"
        role="tooltip"
        aria-hidden="true"
    ></div>
</div>

<script src="/plugin/js/v3-skill.js"></script>
