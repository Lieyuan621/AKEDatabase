<link rel="stylesheet" href="/theme/mission.css?missionStyle=3">
<div class="mission-module" id="missionModule">
    <aside class="mission-sidebar" id="missionSidebar" aria-label="任务列表">
        <div class="mission-sidebar__header">
            <button class="mission-home-button" id="missionHomeButton" type="button" title="任务总览" aria-label="任务总览">⌂</button>
            <label class="mission-search">
                <span aria-hidden="true">⌕</span>
                <input id="missionSearchInput" type="search" autocomplete="off" placeholder="搜索任务名称、ID、目标或对话">
            </label>
        </div>
        <div class="mission-filters">
            <select id="missionTypeFilter" aria-label="任务类型"><option value="all">全部类型</option></select>
            <select id="missionChapterFilter" aria-label="任务章节">
                <option value="all">全部章节</option>
                <option value="1">第一章</option>
                <option value="2">第二章</option>
                <option value="0">未分章</option>
            </select>
            <label class="mission-hidden-toggle"><input id="missionHiddenToggle" type="checkbox"> 内部任务</label>
        </div>
        <div class="mission-list-summary" id="missionListSummary">读取任务数据…</div>
        <div class="mission-list" id="missionList"></div>
    </aside>

    <main class="mission-detail" id="missionDetail">
        <div class="mission-loading"><span></span><p>正在建立任务索引…</p></div>
    </main>

    <button class="mission-mobile-list-button" id="missionMobileListButton" type="button">任务列表</button>
    <button class="mission-mobile-backdrop" id="missionMobileBackdrop" type="button" aria-label="关闭任务列表"></button>
</div>
<script src="/plugin/js/mission.js?missionModule=5"></script>
