<div class="ake-ui-page" data-ake-module="settings">
<section class="ake-ui-section">
    <h3 data-i18n="modules.settings.basicTitle">modules.settings.basicTitle</h3>
    <div class="ake-ui-form-row">
        <label for="themeSelect" data-i18n="settings.theme">settings.theme</label>
        <select id="themeSelect">
            <option value="light" data-i18n="settings.themes.light">settings.themes.light</option>
            <option value="dark" data-i18n="settings.themes.dark">settings.themes.dark</option>
        </select>
    </div>
    <div class="ake-ui-form-row">
        <label for="showHiddenCheck" data-i18n="settings.showHidden">settings.showHidden</label>
        <input type="checkbox" id="showHiddenCheck">
    </div>
</section>
<section class="ake-ui-section">
    <h3 data-i18n="modules.settings.aboutTitle">modules.settings.aboutTitle</h3>
    <p data-i18n="modules.settings.aboutBody">modules.settings.aboutBody</p>
    <p data-i18n="modules.settings.aboutTheme">modules.settings.aboutTheme</p>
</section>
</div>

<script src="/plugin/js/settings.js"></script>
