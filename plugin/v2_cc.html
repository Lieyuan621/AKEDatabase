<!-- plugin/v2_cc.html -->
<link rel="stylesheet" href="/theme/v2_cc.css">
<link rel="stylesheet" href="/theme/v2_dungeon.css">

<div class="v2cc-module">
    <div class="v2cc-left">
        <div class="v2cc-search">
            <input type="text" id="v2ccSearchInput" placeholder="modules.cc.search" data-i18n-placeholder="modules.cc.search">
        </div>
        <div class="v2cc-list" id="v2ccList"></div>
    </div>
    <div class="v2cc-detail" id="v2ccDetail">
        <div class="v2cc-loader" data-i18n="modules.cc.select">modules.cc.select</div>
    </div>
    <div class="v2cc-mobile-btn" id="v2ccMobileListBtn" data-i18n="common.mobileList">common.mobileList</div>
    <div id="v2ccMobileListOverlay" class="v2cc-mobile-overlay">
        <div class="v2cc-mobile-container">
            <div class="v2cc-mobile-header" data-i18n="modules.cc.select">modules.cc.select</div>
            <div class="v2cc-mobile-content" id="v2ccMobileListContent"></div>
        </div>
    </div>
</div>

<script src="/plugin/js/ake-stats.js"></script>
<script src="/plugin/js/v2-cc.js"></script>
