<script src="/plugin/js/v3-table-data.js"></script>
<script src="/plugin/js/v3-buff-data.js"></script>
<link rel="stylesheet" href="/theme/v3_buff.css">

<div class="buffv3-module" id="buffv3Module">
    <aside class="buffv3-sidebar" aria-label="Buff 目录" data-i18n-aria-label="modules.buff.v3.list.sidebarAria">
        <header class="buffv3-sidebar-header">
            <h1 data-i18n="modules.buff.title">Buff</h1>
            <div class="buffv3-list-meta" id="buffv3ListMeta" aria-live="polite" data-i18n="modules.buff.v3.common.loading">正在读取数据</div>
        </header>

        <label class="buffv3-search" for="buffv3SearchInput">
            <span data-i18n="modules.buff.v3.list.searchAria">搜索 BuffData</span>
            <input
                id="buffv3SearchInput"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Buff ID 或归属对象"
                aria-label="搜索 Buff ID 或归属对象"
                data-i18n-placeholder="modules.buff.v3.list.searchPlaceholder"
                data-i18n-aria-label="modules.buff.v3.list.searchAria"
            >
        </label>

        <nav
            class="buffv3-directory"
            id="buffv3Directory"
            aria-label="Buff 归属目录"
            data-i18n-aria-label="modules.buff.v3.list.directoryAria"
        ></nav>
    </aside>

    <main class="buffv3-detail" id="buffv3Detail" tabindex="-1">
        <div class="buffv3-state buffv3-state--loading" role="status">
            <span class="buffv3-spinner" aria-hidden="true"></span>
            <div>
                <h2 data-i18n="modules.buff.title">Buff</h2>
                <p data-i18n="modules.buff.v3.common.loading">正在读取数据</p>
            </div>
        </div>
    </main>

    <button
        class="buffv3-mobile-list-button"
        id="buffv3MobileListButton"
        type="button"
        aria-controls="buffv3MobileOverlay"
        aria-expanded="false"
        data-i18n="modules.buff.v3.buttons.openList"
    >Buff 目录</button>

    <div class="buffv3-mobile-overlay" id="buffv3MobileOverlay" aria-hidden="true">
        <section
            class="buffv3-mobile-panel"
            id="buffv3MobilePanel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="buffv3MobileTitle"
        >
            <header class="buffv3-mobile-header">
                <strong id="buffv3MobileTitle" data-i18n="modules.buff.v3.buttons.selectBuff">选择 Buff</strong>
                <button
                    class="buffv3-icon-button"
                    id="buffv3MobileClose"
                    type="button"
                    aria-label="关闭 Buff 目录"
                    title="关闭"
                    data-i18n-aria-label="modules.buff.v3.buttons.close"
                    data-i18n-title="modules.buff.v3.buttons.close"
                >×</button>
            </header>
            <label class="buffv3-search buffv3-search--mobile" for="buffv3MobileSearchInput">
                <span data-i18n="modules.buff.v3.list.searchAria">搜索 BuffData</span>
                <input
                    id="buffv3MobileSearchInput"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Buff ID 或归属对象"
                    aria-label="搜索 Buff ID 或归属对象"
                    data-i18n-placeholder="modules.buff.v3.list.searchPlaceholder"
                    data-i18n-aria-label="modules.buff.v3.list.searchAria"
                >
            </label>
            <nav
                class="buffv3-directory buffv3-mobile-directory"
                id="buffv3MobileDirectory"
                aria-label="移动端 Buff 归属目录"
                data-i18n-aria-label="modules.buff.v3.list.mobileDirectoryAria"
            ></nav>
        </section>
    </div>
</div>

<script src="/plugin/js/v3-buff.js"></script>
