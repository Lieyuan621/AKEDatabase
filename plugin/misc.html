<div class="ake-ui-directory" id="miscModule" data-ake-module="misc">
    <aside class="ake-ui-directory__sidebar" data-i18n-aria-label="modules.misc.moduleList" aria-label="杂项模块列表">
        <header class="ake-ui-directory__sidebar-header">
            <strong data-i18n="modules.misc.title">杂项</strong>
            <small id="miscModuleCount" data-i18n="modules.misc.loadingManifest">正在读取模块清单</small>
        </header>
        <nav class="ake-ui-directory__list" id="miscModuleList"></nav>
    </aside>

    <main class="ake-ui-directory__content" id="miscContent" role="region" aria-label="杂项模块内容" aria-live="polite">
        <div class="ake-ui-state" data-state="loading">
            <span class="ake-ui-spinner"></span>
            <b data-i18n="modules.misc.loading">正在读取杂项模块</b>
        </div>
    </main>

    <button class="ake-ui-directory__mobile-button" id="miscMobileButton" type="button" aria-haspopup="dialog" aria-controls="miscMobileOverlay" aria-expanded="false" data-i18n="modules.misc.modules">模块</button>
    <div class="ake-ui-directory__mobile-overlay" id="miscMobileOverlay" aria-hidden="true">
        <section class="ake-ui-directory__mobile-panel" role="dialog" aria-modal="true" data-i18n-aria-label="modules.misc.selectModule" aria-label="选择杂项模块">
            <header class="ake-ui-directory__mobile-header">
                <strong data-i18n="modules.misc.selectModule">选择模块</strong>
                <button type="button" data-i18n-aria-label="modules.misc.close" aria-label="关闭">&times;</button>
            </header>
            <nav class="ake-ui-directory__mobile-list" id="miscMobileList"></nav>
        </section>
    </div>
</div>

<script src="/plugin/js/misc.js"></script>
