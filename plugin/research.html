<!-- plugin/research.html -->
<link rel="stylesheet" href="/theme/research.css">
<link rel="stylesheet" href="/theme/module-overview.css">
<script src="/plugin/js/module-overview.js"></script>

<div class="research-module">
    <div class="left-column">
        <div class="list-search">
            <input type="text" id="researchSearchInput" data-i18n-placeholder="modules.research.search" class="search-input">
        </div>
        <div class="research-list" id="researchList"></div>
    </div>
    <div class="research-detail" id="researchDetail">
        <div class="loader" data-i18n="modules.research.loading">modules.research.loading</div>
    </div>
    <div class="research-toc" id="researchToc"></div>
    <div class="toc-toggle-btn" id="tocToggleBtn" data-i18n="modules.research.index">modules.research.index</div>
    <div class="mobile-list-btn" id="researchMobileListBtn" data-i18n="common.mobileList">common.mobileList</div>
    <div id="researchMobileListOverlay" class="mobile-list-overlay">
        <div class="mobile-list-container">
            <div class="mobile-list-header" data-i18n="modules.research.select">modules.research.select</div>
            <div class="mobile-list-content" id="researchMobileListContent"></div>
        </div>
    </div>
</div>

<div id="imgLightbox" class="img-lightbox">
    <span class="img-lightbox-close">&times;</span>
    <img class="img-lightbox-img" src="" alt="">
</div>

<script src="/plugin/js/research.js"></script>
