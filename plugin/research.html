<!-- plugin/research.html -->
<script src="/plugin/js/module-overview.js"></script>

<div class="ake-ui-directory" data-ake-module="research">
    <aside class="ake-ui-directory__sidebar">
        <label class="ake-ui-directory__search">
            <input type="text" id="researchSearchInput" data-i18n-placeholder="modules.research.search" class="ake-ui-input">
        </label>
        <div class="ake-ui-directory__list" id="researchList"></div>
    </aside>
    <main class="ake-ui-directory__content" id="researchDetail">
        <div class="ake-ui-state" data-state="loading" data-layout="page" data-i18n="modules.research.loading">modules.research.loading</div>
    </main>
    <div class="ake-ui-toc" id="researchToc"></div>
    <button class="ake-ui-toc__toggle" id="tocToggleBtn" type="button" data-i18n="modules.research.index">modules.research.index</button>
    <button class="ake-ui-directory__mobile-button" id="researchMobileListBtn" type="button" data-i18n="common.mobileList">common.mobileList</button>
    <div id="researchMobileListOverlay" class="ake-ui-directory__mobile-overlay" aria-hidden="true">
        <section class="ake-ui-directory__mobile-panel">
            <header class="ake-ui-directory__mobile-header" data-i18n="modules.research.select">modules.research.select</header>
            <div class="ake-ui-directory__mobile-list" id="researchMobileListContent"></div>
        </section>
    </div>
</div>

<div id="imgLightbox" class="img-lightbox">
    <span class="img-lightbox-close">&times;</span>
    <img class="img-lightbox-img" src="" alt="">
</div>

<script src="/plugin/js/research.js"></script>
