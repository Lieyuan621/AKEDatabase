<!-- plugin/research.html -->
<link rel="stylesheet" href="/theme/research.css">

<div class="research-module">
    <div class="left-column">
        <div class="list-search">
            <input type="text" id="researchSearchInput" placeholder="搜索文档" class="search-input">
        </div>
        <div class="research-list" id="researchList"></div>
    </div>
    <div class="research-detail" id="researchDetail">
        <div class="loader">加载研究文档...</div>
    </div>
    <div class="mobile-list-btn" id="researchMobileListBtn">📋 列表</div>
    <div id="researchMobileListOverlay" class="mobile-list-overlay">
        <div class="mobile-list-container">
            <div class="mobile-list-header">选择文档</div>
            <div class="mobile-list-content" id="researchMobileListContent"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        let allDocs = [];
        let rawAllDocs = [];
        let activeDocId = null;
        let isInitialized = false;
        let searchTerm = '';

        const mobileBtn = document.getElementById('researchMobileListBtn');
        const mobileOverlay = document.getElementById('researchMobileListOverlay');
        const mobileContent = document.getElementById('researchMobileListContent');

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function parseMarkdown(md) {
            if (!md) return '';
            let html = '';
            const lines = md.split('\n');
            let i = 0;
            let inTable = false;
            let tableHeaders = [];
            let tableAligns = [];
            let inCodeBlock = false;
            let codeBlockLang = '';
            let codeBlockContent = '';
            let inBlockquote = false;
            let blockquoteContent = '';
            let inList = false;
            let listType = '';
            let listItems = [];

            function flushBlockquote() {
                if (inBlockquote && blockquoteContent) {
                    html += '<blockquote>' + parseInline(blockquoteContent.trim()) + '</blockquote>\n';
                    blockquoteContent = '';
                    inBlockquote = false;
                }
            }

            function flushList() {
                if (inList && listItems.length > 0) {
                    const tag = listType === 'ol' ? 'ol' : 'ul';
                    html += '<' + tag + '>';
                    listItems.forEach(function(item) {
                        html += '<li>' + parseInline(item) + '</li>';
                    });
                    html += '</' + tag + '>\n';
                    listItems = [];
                    inList = false;
                    listType = '';
                }
            }

            function flushTable() {
                if (inTable) {
                    html += '</tbody></table>\n';
                    inTable = false;
                    tableHeaders = [];
                    tableAligns = [];
                }
            }

            function parseInline(text) {
                if (!text) return '';
                let result = text;
                result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                result = result.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                result = result.replace(/\*(.+?)\*/g, '<em>$1</em>');
                result = result.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
                result = result.replace(/~~(.+?)~~/g, '<del>$1</del>');
                return result;
            }

            while (i < lines.length) {
                const line = lines[i];
                const trimmed = line.trim();

                if (trimmed.startsWith('```')) {
                    if (inCodeBlock) {
                        html += escapeHtml(codeBlockContent) + '</code></pre>\n';
                        inCodeBlock = false;
                        codeBlockContent = '';
                        codeBlockLang = '';
                    } else {
                        flushBlockquote();
                        flushList();
                        flushTable();
                        inCodeBlock = true;
                        codeBlockLang = trimmed.substring(3).trim();
                        html += '<pre class="code-block' + (codeBlockLang ? ' lang-' + codeBlockLang : '') + '"><code>';
                    }
                    i++;
                    continue;
                }

                if (inCodeBlock) {
                    codeBlockContent += (codeBlockContent ? '\n' : '') + line;
                    i++;
                    continue;
                }

                if (trimmed === '') {
                    flushBlockquote();
                    flushList();
                    flushTable();
                    i++;
                    continue;
                }

                const headerMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
                if (headerMatch) {
                    flushBlockquote();
                    flushList();
                    flushTable();
                    const level = headerMatch[1].length;
                    const headerText = parseInline(headerMatch[2]);
                    const id = headerMatch[2].replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_');
                    html += '<h' + level + ' id="heading-' + id + '">' + headerText + '</h' + level + '>\n';
                    i++;
                    continue;
                }

                if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
                    flushBlockquote();
                    flushList();
                    const cells = trimmed.split('|').slice(1, -1).map(function(c) { return c.trim(); });

                    if (!inTable) {
                        inTable = true;
                        tableHeaders = cells;
                        html += '<table class="md-table"><thead><tr>';
                        cells.forEach(function(cell) {
                            html += '<th>' + parseInline(cell) + '</th>';
                        });
                        html += '</tr></thead><tbody>\n';
                        i++;
                        continue;
                    }

                    const isSeparator = cells.every(function(c) {
                        return /^:?-+:?$/.test(c.trim());
                    });
                    if (isSeparator) {
                        tableAligns = cells.map(function(c) {
                            const s = c.trim();
                            if (s.startsWith(':') && s.endsWith(':')) return 'center';
                            if (s.endsWith(':')) return 'right';
                            return 'left';
                        });
                        i++;
                        continue;
                    }

                    html += '<tr>';
                    cells.forEach(function(cell, idx) {
                        const align = tableAligns[idx] || 'left';
                        html += '<td style="text-align:' + align + '">' + parseInline(cell) + '</td>';
                    });
                    html += '</tr>\n';
                    i++;
                    continue;
                }

                if (inTable) {
                    flushTable();
                }

                if (trimmed.startsWith('>')) {
                    flushList();
                    const quoteText = trimmed.substring(1).trim();
                    if (!inBlockquote) {
                        inBlockquote = true;
                        blockquoteContent = quoteText;
                    } else {
                        blockquoteContent += '\n' + quoteText;
                    }
                    i++;
                    continue;
                }

                if (inBlockquote) {
                    flushBlockquote();
                }

                const olMatch = trimmed.match(/^(\d+)\.\s+(.+)$/);
                if (olMatch) {
                    flushBlockquote();
                    flushTable();
                    if (!inList || listType !== 'ol') {
                        flushList();
                        inList = true;
                        listType = 'ol';
                    }
                    listItems.push(olMatch[2]);
                    i++;
                    continue;
                }

                const ulMatch = trimmed.match(/^[-*+]\s+(.+)$/);
                if (ulMatch) {
                    flushBlockquote();
                    flushTable();
                    if (!inList || listType !== 'ul') {
                        flushList();
                        inList = true;
                        listType = 'ul';
                    }
                    listItems.push(ulMatch[1]);
                    i++;
                    continue;
                }

                flushBlockquote();
                flushList();

                if (trimmed.startsWith('---') || trimmed.startsWith('***') || trimmed.startsWith('___')) {
                    html += '<hr>\n';
                    i++;
                    continue;
                }

                html += '<p>' + parseInline(trimmed) + '</p>\n';
                i++;
            }

            flushBlockquote();
            flushList();
            flushTable();
            if (inCodeBlock) {
                html += escapeHtml(codeBlockContent) + '</code></pre>\n';
            }

            return html;
        }

        function isItemUnlocked(doc) {
            if (!doc.token) return true;
            return window.akeData && window.akeData.isTokenUnlocked
                ? window.akeData.isTokenUnlocked(doc.token)
                : false;
        }

        function filterDocs(docs) {
            let result = docs.filter(function(d) { return isItemUnlocked(d); });
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                result = result.filter(function(d) {
                    return (d.name && d.name.toLowerCase().includes(term)) ||
                           (d.id && d.id.toLowerCase().includes(term));
                });
            }
            return result;
        }

        async function loadResearchManifest(showHidden) {
            try {
                const res = await fetch('/public/CH/research/manifest.json?t=' + Date.now());
                if (!res.ok) throw new Error('无法加载研究文档清单');
                const all = await res.json();
                rawAllDocs = all;
                let docs = showHidden ? all : all.filter(function(d) { return !d.hidden; });
                docs.sort(function(a, b) { return (a.priority || 999) - (b.priority || 999); });
                return docs;
            } catch (err) {
                console.error('加载研究文档清单失败:', err);
                return [];
            }
        }

        function renderDocList() {
            const container = document.getElementById('researchList');
            const detailContainer = document.getElementById('researchDetail');
            if (!container) return;

            const filtered = filterDocs(allDocs);
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loader">无匹配文档</div>';
                if (detailContainer) detailContainer.innerHTML = '<div class="loader">请选择文档</div>';
                activeDocId = null;
                return;
            }

            filtered.forEach(function(doc, index) {
                const item = document.createElement('div');
                item.className = 'research-item' + (doc.id === activeDocId ? ' active' : (index === 0 && !activeDocId ? ' active' : ''));
                item.dataset.docId = doc.id;

                const nameDiv = document.createElement('div');
                nameDiv.className = 'research-name';
                nameDiv.textContent = doc.name;

                item.appendChild(nameDiv);

                item.addEventListener('click', function() {
                    document.querySelectorAll('.research-item').forEach(function(el) { el.classList.remove('active'); });
                    item.classList.add('active');
                    activeDocId = doc.id;
                    if (window.__akeRouter) window.__akeRouter.updateUrl('research', doc.id);
                    loadDocDetail(doc, detailContainer);
                });

                container.appendChild(item);
            });

            if (window.__deepLinkId) {
                const deepItem = filtered.find(function(d) { return d.id === window.__deepLinkId; });
                if (deepItem) {
                    activeDocId = deepItem.id;
                } else {
                    const existsInRaw = rawAllDocs.some(function(d) { return d.id === window.__deepLinkId; });
                    if (window.__akeRouter && window.__akeRouter.onDeepLinkNotFound) {
                        window.__akeRouter.onDeepLinkNotFound(window.__deepLinkId, existsInRaw);
                    }
                }
                window.__deepLinkId = null;
            }

            const activeExists = filtered.some(function(d) { return d.id === activeDocId; });
            if (!activeExists && filtered.length > 0) {
                activeDocId = filtered[0].id;
                const firstItem = container.querySelector('.research-item');
                if (firstItem) firstItem.classList.add('active');
                if (window.__akeRouter) window.__akeRouter.updateUrl('research', activeDocId);
                loadDocDetail(filtered[0], detailContainer);
            } else if (activeExists) {
                const activeDoc = filtered.find(function(d) { return d.id === activeDocId; });
                if (activeDoc) {
                    const activeItem = container.querySelector('.research-item[data-doc-id="' + activeDocId + '"]');
                    if (activeItem) activeItem.classList.add('active');
                    if (window.__akeRouter) window.__akeRouter.updateUrl('research', activeDocId);
                    loadDocDetail(activeDoc, detailContainer);
                }
            }
        }

        async function loadDocDetail(doc, container) {
            if (!isItemUnlocked(doc)) {
                container.innerHTML = '<div class="not-found-page">' +
                    '<div class="not-found-code">404</div>' +
                    '<div class="not-found-title">页面未找到</div>' +
                    '<div class="not-found-desc">您访问的文档不存在</div>' +
                    '</div>';
                return;
            }
            container.innerHTML = '<div class="loader">加载文档内容...</div>';
            try {
                const res = await fetch(doc.contentFile + '?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const mdText = await res.text();
                const rendered = parseMarkdown(mdText);
                container.innerHTML = '<div class="research-article"><div class="article-content">' + rendered + '</div></div>';
                container.scrollTop = 0;
            } catch (err) {
                container.innerHTML = '<div class="error-message">加载失败: ' + escapeHtml(err.message) + '</div>';
            }
        }

        function buildMobileList() {
            if (!mobileContent) return;
            const filtered = filterDocs(allDocs);
            mobileContent.innerHTML = '';
            filtered.forEach(function(doc) {
                const item = document.createElement('div');
                item.className = 'mobile-list-item' + (doc.id === activeDocId ? ' active' : '');
                item.innerHTML = '<div class="item-name">' + escapeHtml(doc.name) + '</div>';
                item.addEventListener('click', function() {
                    activeDocId = doc.id;
                    if (window.__akeRouter) window.__akeRouter.updateUrl('research', doc.id);
                    loadDocDetail(doc, document.getElementById('researchDetail'));
                    closeMobileList();
                    document.querySelectorAll('.research-item').forEach(function(el) { el.classList.remove('active'); });
                    var activeItem = document.querySelector('.research-item[data-doc-id="' + doc.id + '"]');
                    if (activeItem) activeItem.classList.add('active');
                });
                mobileContent.appendChild(item);
            });
        }

        function openMobileList() {
            buildMobileList();
            if (mobileOverlay) mobileOverlay.style.display = 'flex';
        }

        function closeMobileList() {
            if (mobileOverlay) mobileOverlay.style.display = 'none';
        }

        async function refreshModule() {
            var list = document.getElementById('researchList');
            var detail = document.getElementById('researchDetail');
            if (!list || !detail) return;
            var showHidden = (window.akeData && window.akeData.getConfig) ? window.akeData.getConfig().showHidden : false;
            var docs = await loadResearchManifest(showHidden);
            allDocs = docs;
            renderDocList();
            if (mobileOverlay && mobileOverlay.style.display === 'flex') buildMobileList();
        }

        async function initModule() {
            if (isInitialized) return;
            isInitialized = true;
            if (window.configLoaded) await window.configLoaded;

            window.addEventListener('globalConfigChanged', function() {
                searchTerm = '';
                var searchInput = document.getElementById('researchSearchInput');
                if (searchInput) searchInput.value = '';
                refreshModule();
            });

            var searchInput = document.getElementById('researchSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    searchTerm = e.target.value;
                    renderDocList();
                    if (mobileOverlay && mobileOverlay.style.display === 'flex') buildMobileList();
                });
            }

            if (mobileBtn) mobileBtn.addEventListener('click', openMobileList);
            if (mobileOverlay) mobileOverlay.addEventListener('click', function(e) {
                if (e.target === mobileOverlay) closeMobileList();
            });

            await refreshModule();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initModule);
        } else {
            initModule();
        }
    })();
</script>
