<!-- plugin/research.html -->
<link rel="stylesheet" href="/theme/research.css">

<div class="research-module">
    <div class="left-column">
        <div class="list-search">
            <input type="text" id="researchSearchInput" placeholder="搜索文档" class="search-input">
        </div>
        <div class="research-list" id="researchList"></div>
    </div>
    <div class="research-detail" id="researchDetail">
        <div class="loader">加载研究文档...</div>
    </div>
    <div class="research-toc" id="researchToc"></div>
    <div class="toc-toggle-btn" id="tocToggleBtn">📑 索引</div>
    <div class="mobile-list-btn" id="researchMobileListBtn">📋 列表</div>
    <div id="researchMobileListOverlay" class="mobile-list-overlay">
        <div class="mobile-list-container">
            <div class="mobile-list-header">选择文档</div>
            <div class="mobile-list-content" id="researchMobileListContent"></div>
        </div>
    </div>
</div>

<div id="imgLightbox" class="img-lightbox">
    <span class="img-lightbox-close">&times;</span>
    <img class="img-lightbox-img" src="" alt="">
</div>

<script src="/plugin/js/research.js"></script>
